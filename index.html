<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>邮票化小工具</title>
  <meta name="theme-color" content="#1e1f22">
  <link rel="stylesheet" href="index.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png" type="image/png">
  <!-- iOS 不读 manifest 里的 icons，主屏图标只认这个 -->
  <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body class="drawer-open">
  <div class="app">
    <aside class="panel" id="panel">
      <h1>邮票化</h1>

      <!-- 由内到外：照片 → 边框 → 内边距 → 齿孔 → 外边距 → 底色 -->

      <section class="group">
        <h2 class="group-title">照片与齿孔</h2>
        <button id="pickBtn" class="primary">选择图片（可多选）</button>
        <button id="clearBtn" class="ghost small">清空图片</button>
        <input type="file" id="fileInput" accept="image/*" multiple hidden>
        <p class="hint" id="imgInfo">未选择图片</p>

        <div class="tabs">
          <div class="tab-bar" id="stampTabs">
            <button class="tab-btn active" type="button" data-tab="matrix">矩阵</button>
            <button class="tab-btn" type="button" data-tab="perf">齿孔</button>
          </div>

          <div class="tab-panel" id="tab-matrix">
            <div class="field-row">
              <label>列数 X
                <input type="number" id="matrixX" value="1" min="1" step="1">
              </label>
              <label>行数 Y
                <input type="number" id="matrixY" value="1" min="1" step="1">
              </label>
            </div>
            <div class="field-row">
              <label>跨格宽
                <input type="number" id="spanX" value="1" min="1" step="1">
              </label>
              <label>跨格高
                <input type="number" id="spanY" value="1" min="1" step="1">
              </label>
            </div>
            <p class="hint">连票：连续「跨格宽×跨格高」格合成一张图，组内不留白边</p>
          </div>

          <div class="tab-panel" id="tab-perf" hidden>
            <div class="field-row">
              <label>孔直径 (px)
                <input type="number" id="holeD" value="8" min="1" step="1">
              </label>
              <label>孔间距 (px)
                <input type="number" id="holeG" value="4" min="0" step="1">
              </label>
            </div>
            <div class="field-row">
              <label>水平齿孔数
                <input type="number" id="nx" value="16" min="3" step="1">
              </label>
              <label>垂直齿孔数
                <input type="number" id="ny" value="24" min="3" step="1">
              </label>
            </div>
          </div>
        </div>
      </section>

      <section class="group tabs-group">
        <div class="tab-bar" id="layerTabs">
          <button class="tab-btn" type="button" data-tab="border">边框</button>
          <button class="tab-btn active" type="button" data-tab="inner">内边距</button>
          <button class="tab-btn" type="button" data-tab="outer">外边距</button>
          <button class="tab-btn" type="button" data-tab="base">底色</button>
        </div>

        <div class="tab-panel" id="tab-border" hidden>
        <p class="hint">每组图片外的实线边框，画在内边距内缘；图片会再内缩「粗细 + 间距」</p>
        <div class="field-row">
          <label>边框粗细 (px)
            <input type="number" id="borderWidth" value="0" min="0" step="1">
          </label>
          <label>边框间距 (px)
            <input type="number" id="borderGap" value="0" min="0" step="1">
          </label>
        </div>
        <label>边框颜色
          <input type="color" id="borderColor" value="#ffffff">
        </label>
        <label>边框透明度 <span id="borderOpacityVal">1.00</span>
          <input type="range" id="borderOpacity" min="0" max="1" step="0.01" value="1">
        </label>
        </div>

        <div class="tab-panel" id="tab-inner">
        <label>内边距宽度（孔数，四向可调）<span id="innerMarginHint">≈ 9px</span>
          <div class="margin-pad">
            <input type="number" id="innerMarginTop" class="margin-cell margin-top" value="0.75" min="0" step="0.25" aria-label="上内边距">
            <input type="number" id="innerMarginLeft" class="margin-cell margin-left" value="0.75" min="0" step="0.25" aria-label="左内边距">
            <input type="number" id="innerMarginAll" class="margin-cell margin-all" min="0" step="0.25" placeholder="统一" aria-label="统一内边距">
            <input type="number" id="innerMarginRight" class="margin-cell margin-right" value="0.75" min="0" step="0.25" aria-label="右内边距">
            <input type="number" id="innerMarginBottom" class="margin-cell margin-bottom" value="0.75" min="0" step="0.25" aria-label="下内边距">
          </div>
        </label>
        <label>内边距填充
          <select id="innerFill">
            <option value="solid" selected>纯色</option>
            <option value="linear">线性渐变</option>
            <option value="radial">径向渐变</option>
          </select>
        </label>
        <label id="innerColorRow">内边距背景色
          <input type="color" id="innerColor" value="#ffffff">
        </label>
        <label>内边距背景色透明度 <span id="innerColorOpacityVal">1.00</span>
          <input type="range" id="innerColorOpacity" min="0" max="1" step="0.01" value="1">
        </label>
        <div id="innerGradientControls" class="gradient-controls" hidden>
          <div id="innerStopsEditor"></div>
          <button id="innerAddStop" class="ghost small" type="button">+ 添加色档</button>
          <label id="innerAngleRow">渐变角度 <span class="angle-readout"><span id="innerAngleVal">90°</span><span id="innerAngleArrow" class="angle-arrow" aria-hidden="true">↓</span></span>
            <input type="range" id="innerAngle" min="0" max="360" step="1" value="90">
          </label>
          <div id="innerOriginRow" hidden>
            <label>原点 X <span id="innerOriginXVal">0.50</span>
              <input type="range" id="innerOriginX" min="0" max="1" step="0.01" value="0.5">
            </label>
            <label>原点 Y <span id="innerOriginYVal">0.50</span>
              <input type="range" id="innerOriginY" min="0" max="1" step="0.01" value="0.5">
            </label>
          </div>
        </div>
        <div class="img-picker">
          <span class="picker-label">内边距背景图（cover 居中，叠加于色/渐变上）</span>
          <div class="picker-btns">
            <button id="innerImgBtn" class="ghost small" type="button">选择</button>
            <button id="innerImgClear" class="ghost small" type="button">清空</button>
          </div>
          <input type="file" id="innerImgInput" accept="image/*" hidden>
          <span class="hint" id="innerImgInfo">无</span>
        </div>
        <label>内边距背景图透明度 <span id="innerImageOpacityVal">1.00</span>
          <input type="range" id="innerImageOpacity" min="0" max="1" step="0.01" value="1">
        </label>
        </div>

        <div class="tab-panel" id="tab-outer" hidden>
        <label>外边距宽度（孔数，四向可调）<span id="outerMarginHint">≈ 4px</span>
          <div class="margin-pad">
            <input type="number" id="outerMarginTop" class="margin-cell margin-top" value="0" min="0" step="0.5" aria-label="上边距">
            <input type="number" id="outerMarginLeft" class="margin-cell margin-left" value="0" min="0" step="0.5" aria-label="左边距">
            <input type="number" id="outerMarginAll" class="margin-cell margin-all" min="0" step="0.5" placeholder="统一" aria-label="统一边距">
            <input type="number" id="outerMarginRight" class="margin-cell margin-right" value="0" min="0" step="0.5" aria-label="右边距">
            <input type="number" id="outerMarginBottom" class="margin-cell margin-bottom" value="0" min="0" step="0.5" aria-label="下边距">
          </div>
        </label>
        <label>外边距填充
          <select id="outerFill">
            <option value="solid" selected>纯色</option>
            <option value="linear">线性渐变</option>
            <option value="radial">径向渐变</option>
          </select>
        </label>
        <label id="outerColorRow">外边距背景色
          <input type="color" id="outerColor" value="#000000">
        </label>
        <label>外边距背景色透明度 <span id="outerColorOpacityVal">0.00</span>
          <input type="range" id="outerColorOpacity" min="0" max="1" step="0.01" value="0">
        </label>
        <div id="outerGradientControls" class="gradient-controls" hidden>
          <div id="outerStopsEditor"></div>
          <button id="outerAddStop" class="ghost small" type="button">+ 添加色档</button>
          <label id="outerAngleRow">渐变角度 <span class="angle-readout"><span id="outerAngleVal">90°</span><span id="outerAngleArrow" class="angle-arrow" aria-hidden="true">↓</span></span>
            <input type="range" id="outerAngle" min="0" max="360" step="1" value="90">
          </label>
          <div id="outerOriginRow" hidden>
            <label>原点 X <span id="outerOriginXVal">0.50</span>
              <input type="range" id="outerOriginX" min="0" max="1" step="0.01" value="0.5">
            </label>
            <label>原点 Y <span id="outerOriginYVal">0.50</span>
              <input type="range" id="outerOriginY" min="0" max="1" step="0.01" value="0.5">
            </label>
          </div>
        </div>
        <div class="img-picker">
          <span class="picker-label">外边距背景图（cover 居中）</span>
          <div class="picker-btns">
            <button id="outerImgBtn" class="ghost small" type="button">选择</button>
            <button id="outerImgClear" class="ghost small" type="button">清空</button>
          </div>
          <input type="file" id="outerImgInput" accept="image/*" hidden>
          <span class="hint" id="outerImgInfo">无</span>
        </div>
        <label>外边距背景图透明度 <span id="outerImageOpacityVal">1.00</span>
          <input type="range" id="outerImageOpacity" min="0" max="1" step="0.01" value="1">
        </label>
        </div>

        <div class="tab-panel" id="tab-base" hidden>
        <p class="hint">最底层，齿孔镂空处透出此色</p>
        <label>底色
          <input type="color" id="baseColor" value="#000000">
        </label>
        <label>底色透明度 <span id="baseOpacityVal">1.00</span>
          <input type="range" id="baseOpacity" min="0" max="1" step="0.01" value="1">
        </label>
        </div>
      </section>

      <section class="group">
        <h2 class="group-title">导出</h2>
        <label>导出倍率
          <select id="exportScale">
            <option value="1">1x</option>
            <option value="2" selected>2x</option>
            <option value="4">4x</option>
          </select>
        </label>
        <button id="exportBtn" class="primary">导出 PNG</button>
        <p class="hint">方案：将当前所有参数与图片打包为 .json，可在其它设备/浏览器还原</p>
        <div class="picker-btns">
          <button id="exportSchemeBtn" class="ghost small" type="button">导出方案</button>
          <button id="importSchemeBtn" class="ghost small" type="button">导入方案</button>
          <button id="resetSchemeBtn" class="ghost small danger" type="button">重置</button>
        </div>
        <input type="file" id="schemeInput" accept="application/json,.json" hidden>
        <p class="hint" id="schemeInfo"></p>
      </section>
    </aside>

    <!-- 抽屉把手：仅窄屏可见，与 .panel/.stage 同为 .app 的 flex 子项（不随面板滚动） -->
    <button class="drawer-handle" id="drawerHandle" type="button" aria-expanded="true" aria-controls="panel">
      <span class="drawer-grip" aria-hidden="true"></span>
      <span class="drawer-label">设置</span>
    </button>

    <main class="stage">
      <div class="stage-bar">
        <button id="viewToggle" class="ghost" type="button">1:1 视图</button>
        <div class="seg" id="dragTargetSeg" role="group" aria-label="拖拽/缩放调整对象">
          <button class="seg-btn" type="button" data-target="photo">照片</button>
          <button class="seg-btn" type="button" data-target="inner">内图</button>
          <button class="seg-btn" type="button" data-target="outer">外图</button>
          <button class="seg-btn active" type="button" data-target="auto">自动</button>
        </div>
      </div>
      <div class="canvas-area" id="canvasArea">
        <div class="canvas-wrap">
          <canvas id="preview"></canvas>
        </div>
      </div>
      <p class="hint stage-hint desktop-only">拖拽平移照片 · 滚轮以光标为锚点缩放 · 外边距区域调外背景图 · 按住 Alt/Option 调内背景图</p>
      <p class="hint stage-hint touch-only">单指拖拽平移 · 双指捏合缩放 · 用上方按钮切换调整对象</p>
    </main>
  </div>

  <script src="index.js"></script>
</body>
</html>
