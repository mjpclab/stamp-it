<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>邮票化小工具</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="app">
    <aside class="panel">
      <h1>邮票化</h1>

      <!-- 由内到外：照片 → 内边距 → 齿孔 → 外边距 -->

      <section class="group">
        <h2 class="group-title">照片与齿孔（最内）</h2>
        <button id="pickBtn" class="primary">选择图片（可多选）</button>
        <button id="clearBtn" class="ghost small">清空图片</button>
        <input type="file" id="fileInput" accept="image/*" multiple hidden>
        <p class="hint" id="imgInfo">未选择图片</p>
        <div class="field-row">
          <label>列数 X
            <input type="number" id="matrixX" value="1" min="1" step="1">
          </label>
          <label>行数 Y
            <input type="number" id="matrixY" value="1" min="1" step="1">
          </label>
        </div>
        <div class="field-row">
          <label>孔直径 (px)
            <input type="number" id="holeD" value="8" min="1" step="1">
          </label>
          <label>孔间距 (px)
            <input type="number" id="holeG" value="4" min="0" step="1">
          </label>
        </div>
        <div class="field-row">
          <label>水平齿孔数
            <input type="number" id="nx" value="20" min="3" step="1">
          </label>
          <label>垂直齿孔数
            <input type="number" id="ny" value="14" min="3" step="1">
          </label>
        </div>
      </section>

      <section class="group">
        <h2 class="group-title">内边距</h2>
        <label>内边距填充
          <select id="innerFill">
            <option value="solid" selected>纯色</option>
            <option value="linear">线性渐变</option>
            <option value="radial">径向渐变</option>
          </select>
        </label>
        <label id="innerColorRow">内边距背景色
          <input type="color" id="innerColor" value="#d4af37">
        </label>
        <label>内边距背景色透明度 <span id="innerColorOpacityVal">1.00</span>
          <input type="range" id="innerColorOpacity" min="0" max="1" step="0.01" value="1">
        </label>
        <div id="gradientControls" hidden>
          <div id="stopsEditor"></div>
          <button id="addStop" class="ghost small" type="button">+ 添加色档</button>
          <label id="angleRow">渐变角度 <span id="innerAngleVal">90°</span>
            <input type="range" id="innerAngle" min="0" max="360" step="1" value="90">
          </label>
          <div id="originRow" hidden>
            <label>原点 X <span id="originXVal">0.50</span>
              <input type="range" id="originX" min="0" max="1" step="0.01" value="0.5">
            </label>
            <label>原点 Y <span id="originYVal">0.50</span>
              <input type="range" id="originY" min="0" max="1" step="0.01" value="0.5">
            </label>
          </div>
        </div>
        <div class="img-picker">
          <span class="picker-label">内边距背景图（cover 居中，叠加于色/渐变上）</span>
          <div class="picker-btns">
            <button id="innerImgBtn" class="ghost small" type="button">选择</button>
            <button id="innerImgClear" class="ghost small" type="button">清空</button>
          </div>
          <input type="file" id="innerImgInput" accept="image/*" hidden>
          <span class="hint" id="innerImgInfo">无</span>
        </div>
        <label>内边距背景图透明度 <span id="innerImageOpacityVal">1.00</span>
          <input type="range" id="innerImageOpacity" min="0" max="1" step="0.01" value="1">
        </label>
      </section>

      <section class="group">
        <h2 class="group-title">外边距（最外）</h2>
        <label>外边距宽度（孔数，四向可调）<span id="outerMarginHint">≈ 4px</span>
          <div class="margin-pad">
            <input type="number" id="outerMarginTop" class="margin-cell margin-top" value="0" min="0" step="1" aria-label="上边距">
            <input type="number" id="outerMarginLeft" class="margin-cell margin-left" value="0" min="0" step="1" aria-label="左边距">
            <input type="number" id="outerMarginAll" class="margin-cell margin-all" min="0" step="1" placeholder="统一" aria-label="统一边距">
            <input type="number" id="outerMarginRight" class="margin-cell margin-right" value="0" min="0" step="1" aria-label="右边距">
            <input type="number" id="outerMarginBottom" class="margin-cell margin-bottom" value="0" min="0" step="1" aria-label="下边距">
          </div>
        </label>
        <label>外边距背景色
          <input type="color" id="outerColor" value="#000000">
        </label>
        <label>外边距背景色透明度 <span id="outerColorOpacityVal">0.00</span>
          <input type="range" id="outerColorOpacity" min="0" max="1" step="0.01" value="0">
        </label>
        <div class="img-picker">
          <span class="picker-label">外边距背景图（cover 居中）</span>
          <div class="picker-btns">
            <button id="outerImgBtn" class="ghost small" type="button">选择</button>
            <button id="outerImgClear" class="ghost small" type="button">清空</button>
          </div>
          <input type="file" id="outerImgInput" accept="image/*" hidden>
          <span class="hint" id="outerImgInfo">无</span>
        </div>
        <label>外边距背景图透明度 <span id="outerImageOpacityVal">1.00</span>
          <input type="range" id="outerImageOpacity" min="0" max="1" step="0.01" value="1">
        </label>
      </section>

      <section class="group">
        <h2 class="group-title">底色（最底层 · 齿孔镂空透出）</h2>
        <label>底色
          <input type="color" id="baseColor" value="#000000">
        </label>
        <label>底色透明度 <span id="baseOpacityVal">1.00</span>
          <input type="range" id="baseOpacity" min="0" max="1" step="0.01" value="1">
        </label>
      </section>

      <section class="group">
        <h2 class="group-title">导出</h2>
        <label>导出倍率
          <select id="exportScale">
            <option value="1">1x</option>
            <option value="2" selected>2x</option>
            <option value="4">4x</option>
          </select>
        </label>
        <button id="exportBtn" class="primary">导出 PNG</button>
      </section>
    </aside>

    <main class="stage">
      <div class="stage-bar">
        <button id="viewToggle" class="ghost" type="button">1:1 视图</button>
      </div>
      <div class="canvas-wrap">
        <canvas id="preview"></canvas>
      </div>
      <p class="hint stage-hint">拖拽平移照片 · 滚轮以光标为锚点缩放</p>
    </main>
  </div>

  <script src="index.js"></script>
</body>
</html>
